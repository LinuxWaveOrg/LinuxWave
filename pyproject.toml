# pyproject.toml
#
# 这个文件有两个作用，都不是「把 LinuxWave 打包上 PyPI」——
# LinuxWave 由 lib/install.sh 安装，不通过 pip 分发。
#
#   1. 声明运行时依赖，作为**唯一的事实来源**
#   2. 给 ruff 一份配置，让每个人的格式化与检查结果一致
#
# 为什么需要第 1 条：同一份依赖清单原先散在好几处 ——
#   lib/install.sh            pip install requests packaging rich
#   lib/selfupdate.sh         同样一行
#   .github/workflows/*.yml   两处 pip install
# 改一处漏几处，症状是「某个 CI 里 ImportError」。现在由
# scripts/depsync_test.sh 断言两边一致，走散就红。
#
# 注意 `dependencies` 不等于 install.sh 要装的全部：install.sh 连可选依赖
# （rich，进度条）也一并装上，因为它要的是开箱即用的体验。两者的一致性
# 由那条测试按「必需 + 可选」的并集比对。

[project]
name = "linuxwave"
# 真实版本号在 configdata 仓库的 linuxwavedata/latest.toml —— 那是客户端与
# 安装脚本读取的唯一来源。这里是 PEP 621 的必填项，不参与任何判断。
version = "0.0.0"
description = "A package manager for Linux software."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LinuxWave Team" }]

# 运行时**必需**：缺一个就起不来。
#   requests   —— 所有 HTTP
#   packaging  —— 版本号比较
#   urllib3    —— --skip-ssl 时抑制 InsecureRequestWarning，tls.py 硬编码导入
dependencies = [
    "requests>=2.20",
    "packaging>=21.0",
    "urllib3>=1.25",
]

[project.optional-dependencies]
# 可选：没有它只是没有进度条（pkg/pkginstaller.py 里 RICH_AVAILABLE 会退回
# 无进度条路径）。install.sh 默认装它。
progress = ["rich>=12.0"]

[project.urls]
Homepage = "https://linuxwave.org"
Repository = "https://github.com/LinuxWaveOrg/LinuxWave"
Issues = "https://github.com/LinuxWaveOrg/LinuxWave/issues"

# -------------------- ruff --------------------
#
# .vscode/settings.json 早就把 ruff 指定为默认格式化器，但一直没有配置文件 ——
# 于是每个人保存时用的规则取决于各自装的 ruff 版本与默认值，格式化结果互相打架。

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# 起步只开 E/F/W：这三类是「几乎确定是 bug」的集合。
select = ["E", "F", "W"]

ignore = [
    # 长行。能折的 formatter 会折，剩下的都是折不断的错误消息与 URL。
    "E501",
    # 导入不在文件顶部 —— 这里是有意的：模块先 sys.path.insert 再导入。
    "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
